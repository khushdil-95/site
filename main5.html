<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula Heart</title>
<style>
  :root{
    --bg: #000000;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: var(--bg);
  }
  /* Небольшая подпись в углу — можно убрать */
  .label {
    position: fixed;
    left: 12px;
    bottom: 10px;
    color: #666;
    font: 12px system-ui, sans-serif;
    letter-spacing: 1px;
    user-select: none;
    pointer-events: none;
  }
  .hint {
    position: fixed;
    right: 12px;
    bottom: 10px;
    color: #555;
    font: 11px system-ui, sans-serif;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">Nebula Heart</div>
<div class="hint">клик / пробел — перезапустить</div>

<script>
/* ============================================================
   NEBULA HEART — рой "черепашек" (turtle), стягивающихся
   в контур сердца, как в оригинале на Python/turtle.
   Переписано на чистый HTML5 Canvas + JS одним файлом,
   чтобы открывалось прямо в браузере (в т.ч. на GitHub Pages)
   без установки Python.

   КАК ЭТО РАБОТАЕТ В ОРИГИНАЛЕ (восстановлено по видео):
     - swarm_size=300 "частиц" стартуют в случайных точках
       вокруг центра: random.uniform(0, 2*pi) по углу и
       random.uniform(50, 300) по дистанции;
     - у каждой частицы есть своя целевая точка на кривой
       сердца (индекс i задаёт положение на контуре);
     - экран НЕ очищается и линии НЕ гаснут — turtle просто
       рисует новый отрезок пути каждый "кадр" (frame),
       поэтому все штрихи остаются на экране навсегда;
     - цвет — общий для всех частиц в данный момент времени
       (не свой у каждой) и зависит от номера кадра:
       в начале анимации (frame≈0) — красный, к концу
       (frame≈total) — фиолетовый/пурпурный, через
       colorsys.hsv_to_rgb;
     - из-за того что линии рисуются с аддитивным наложением
       (glow/lighter), в центре, где на старте все частицы
       ещё скучены и линии короткие и часто пересекаются,
       возникает яркое красное свечение, а к контуру сердца
       расходятся пурпурные лучи — именно это видно в
       оригинальном ролике.
   ============================================================ */

// ---------- НАСТРОЙКИ (можно менять для улучшения/вариаций) ----------
const CONFIG = {
  particleCount: 300,       // swarm_size в оригинале
  durationMs: 16000,        // сколько реального времени идёт сборка сердца (было слишком быстро — увеличено)
  startDistMin: 50,         // random.uniform(50, 300) в оригинале
  startDistMax: 300,
  heartScale: 13,           // масштаб кривой сердца (высота ~ heartScale*21)
  // Оттенок идёт от красного к фиолетовому КОРОТКИМ путём по кругу HSV —
  // через розовый/пурпурный (а не через жёлтый-зелёный-голубой).
  // hueEnd отрицательный специально: 0 -> -0.18 при переводе в hue
  // соответствует движению 0 -> 0.82 "в другую сторону" колеса.
  hueStart: 0.0,            // оттенок в начале анимации (0 = красный)
  hueEnd: -0.18,            // оттенок в конце анимации (эквивалент 0.82 = фиолетово-розовый)
  lineWidth: 1.1,           // толщина основного (чёткого) штриха
  lineAlpha: 0.30,          // прозрачность основного штриха
  glowLineWidth: 4.5,       // толщина второго, размытого штриха (создаёт мягкое сияние)
  glowLineAlpha: 0.10,      // прозрачность размытого штриха
  glow: 10,                 // сила свечения (shadowBlur) у чёткого штриха
  glowBlurExtra: 18,        // сила свечения у размытого штриха — сильнее, для мягкого ореола
  moveEasing: 'easeOutQuint', // характер сближения частиц к цели: чем "мягче" в начале, тем более тягучим кажется полёт
  restartOnClick: true,     // клик / пробел — перезапуск анимации
  autoRestartDelayMs: 4000  // пауза перед авто-рестартом после завершения (null — не рестартовать)
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- Параметрическая кривая сердца (цель для частиц) ----------
function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return {
    x: x * scale,
    y: -y * scale // инверсия Y — в canvas ось Y растёт вниз
  };
}

// ---------- HSV -> RGB / RGBA (как colorsys.hsv_to_rgb в оригинале) ----------
function hsvToRgb(h, s, v) {
  let r, g, b;
  const i = Math.floor(h * 6);
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return { r: Math.round(r*255), g: Math.round(g*255), b: Math.round(b*255) };
}
function rgbToCss({r,g,b}, a) { return a === undefined ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${a})`; }

// ---------- Кривые сглаживания (easing) ----------
const EASINGS = {
  linear: (x) => x,
  easeOutCubic: (x) => 1 - Math.pow(1 - x, 3),
  // ещё мягче на старте и с более долгим "дотягиванием" в конце —
  // из-за этого полёт частиц ощущается более плавным и тягучим,
  // ближе к неспешному темпу оригинала
  easeOutQuint: (x) => 1 - Math.pow(1 - x, 5),
  easeInOutCubic: (x) => x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2
};
function ease(name, x) {
  const fn = EASINGS[name] || EASINGS.linear;
  return fn(Math.min(1, Math.max(0, x)));
}

// ---------- Частица ("turtle") ----------
class Particle {
  constructor(index, total) {
    const angle = Math.random() * Math.PI * 2;
    const dist = CONFIG.startDistMin + Math.random() * (CONFIG.startDistMax - CONFIG.startDistMin);
    this.sx = cx + dist * Math.cos(angle); // старт X
    this.sy = cy + dist * Math.sin(angle); // старт Y

    // целевая точка на контуре сердца — распределена по индексу частицы
    const t = (index / total) * Math.PI * 2;
    const target = heartPoint(t, CONFIG.heartScale);
    this.tx = cx + target.x;
    this.ty = cy + target.y;
  }
  // позиция при глобальном прогрессе анимации t (0..1)
  positionAt(t) {
    const e = ease(CONFIG.moveEasing, t);
    return {
      x: this.sx + (this.tx - this.sx) * e,
      y: this.sy + (this.ty - this.sy) * e
    };
  }
}

let particles = [];
let running = false;
let restartTimer = null;
let startTime = 0;
let lastT = 0;

function initScene() {
  particles = [];
  for (let i = 0; i < CONFIG.particleCount; i++) {
    particles.push(new Particle(i, CONFIG.particleCount));
  }
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);
  ctx.lineCap = 'round';
  lastT = 0;
  startTime = 0;
}

// цвет для данного момента t (0..1) — та же ease-кривая, что и для движения:
// красный держится только на старте (пока частицы ещё скучены в центре),
// затем быстро уходит в пурпурный и надолго там задерживается
function colorAt(t) {
  const hueT = ease('easeOutQuint', t);
  let hue = CONFIG.hueStart + (CONFIG.hueEnd - CONFIG.hueStart) * hueT;
  hue = ((hue % 1) + 1) % 1;
  return hsvToRgb(hue, 0.95, 1);
}

function drawSegment(t0, t1) {
  const rgb = colorAt(t1);

  // 1) мягкое размытое сияние (широкий, очень прозрачный штрих с сильным blur)
  ctx.shadowBlur = CONFIG.glowBlurExtra;
  ctx.shadowColor = rgbToCss(rgb);
  ctx.strokeStyle = rgbToCss(rgb, CONFIG.glowLineAlpha);
  ctx.lineWidth = CONFIG.glowLineWidth;
  ctx.beginPath();
  for (const p of particles) {
    const a = p.positionAt(t0);
    const b = p.positionAt(t1);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
  }
  ctx.stroke();

  // 2) чёткая яркая линия поверх (тонкий штрих с умеренным blur)
  ctx.shadowBlur = CONFIG.glow;
  ctx.strokeStyle = rgbToCss(rgb, CONFIG.lineAlpha);
  ctx.lineWidth = CONFIG.lineWidth;
  ctx.beginPath();
  for (const p of particles) {
    const a = p.positionAt(t0);
    const b = p.positionAt(t1);
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
  }
  ctx.stroke();
}

function animate(now) {
  if (!running) return;
  if (!startTime) startTime = now;
  const elapsed = now - startTime;
  const t = Math.min(1, elapsed / CONFIG.durationMs);

  drawSegment(lastT, t);
  lastT = t;

  if (t < 1) {
    requestAnimationFrame(animate);
  } else {
    running = false;
    if (CONFIG.autoRestartDelayMs !== null) {
      restartTimer = setTimeout(restart, CONFIG.autoRestartDelayMs);
    }
  }
}

function restart() {
  clearTimeout(restartTimer);
  initScene();
  running = true;
  requestAnimationFrame(animate);
}

if (CONFIG.restartOnClick) {
  window.addEventListener('click', restart);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') restart();
  });
}

// ---------- Запуск ----------
initScene();
running = true;
requestAnimationFrame(animate);
</script>
</body>
</html>
