<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обувной магазин «Шаг»</title>
<style>
  body { font-family: Verdana, Arial, sans-serif; background: #f4efe6; margin: 0; color: #222; }
  a { color: #7a2e0e; }
  .h { background: #7a2e0e; color: #fff; padding: 12px; text-align: center; }
  .h h1 { margin: 0; font-family: Georgia, serif; }
  .n { background: #d9c7a8; padding: 8px; text-align: center; border-bottom: 2px solid #7a2e0e; }
  .n a { display: inline-block; margin: 3px; padding: 5px 12px; background: #fff; border: 1px solid #7a2e0e; text-decoration: none; cursor: pointer; }
  .n a.on { background: #7a2e0e; color: #fff; }
  .w { max-width: 960px; margin: auto; padding: 10px; }
  .g { display: flex; flex-wrap: wrap; gap: 10px; }
  .c { width: calc(33% - 8px); min-width: 220px; flex-grow: 1; background: #fff; border: 1px solid #999; padding: 8px; text-align: center; box-sizing: border-box; }
  .c img { width: 100%; height: 180px; object-fit: cover; border: 1px solid #ccc; }
  .p { font-size: 18px; font-weight: bold; color: #7a2e0e; }
  .b { background: #7a2e0e; color: #fff; border: 0; padding: 7px 14px; cursor: pointer; }
  .k { background: #fff; border: 2px solid #7a2e0e; padding: 10px; margin-top: 15px; }
  .f { text-align: center; font-size: 12px; padding: 15px; color: #666; }
</style>
</head>
<body>

<!-- Шапка -->
<div class="h">
  <h1>👞 Обувной магазин «Шаг» 👟</h1>
  <marquee>Бесплатная доставка от 10000 ₽ &bull; Скидка 10% на второй товар &bull; Примерка при получении</marquee>
</div>

<!-- Навигация -->
<div class="n" id="nav"></div>

<!-- Контент -->
<div class="w">
  <div class="g" id="list"></div>
  <div class="k">
    <h2>Корзина (<span id="cn">0</span>)</h2>
    <div id="cart">Пока пусто</div>
    <p>Итого: <span class="p" id="tot">0 ₽</span>
      <button class="b" onclick="buy()">Оформить заказ</button>
    </p>
  </div>
</div>

<!-- Подвал -->
<div class="f">© 2026 Обувной магазин «Шаг». Учебный проект.</div>

<script>
// ---------- ДАННЫЕ ----------
var C = [
  ['all', 'Все'],
  ['m', 'Мужская'],
  ['w', 'Женская'],
  ['k', 'Детская'],
  ['s', 'Спортивная']
];

var K = {
  'Чёрный': '#222',
  'Коричневый': '#6b3e26',
  'Белый': '#f2f2f2',
  'Красный': '#c0392b',
  'Синий': '#2c5aa0',
  'Серый': '#888',
  'Бежевый': '#d8c3a5',
  'Зелёный': '#3c8d4f',
  'Розовый': '#e48aa8'
};

var Z = {
  m: [40, 46],
  w: [36, 41],
  k: [28, 35],
  s: [38, 46]
};

var P = [
  [1, 'm', 'Туфли Оксфорд', 5990, 0, ['Чёрный', 'Коричневый']],
  [2, 'm', 'Ботинки Челси', 7490, 1, ['Коричневый', 'Чёрный', 'Серый']],
  [3, 'm', 'Лоферы классические', 4990, 0, ['Бежевый', 'Коричневый']],
  [4, 'w', 'Туфли-лодочки', 6290, 2, ['Красный', 'Чёрный', 'Бежевый']],
  [5, 'w', 'Ботильоны на каблуке', 8190, 1, ['Чёрный', 'Серый', 'Розовый']],
  [6, 'w', 'Балетки кожаные', 3990, 0, ['Розовый', 'Белый', 'Чёрный']],
  [7, 'k', 'Кеды детские', 2490, 0, ['Синий', 'Красный', 'Белый']],
  [8, 'k', 'Ботинки утеплённые', 3790, 1, ['Зелёный', 'Синий']],
  [9, 'k', 'Сандалии летние', 1990, 3, ['Розовый', 'Синий', 'Белый']],
  [10, 's', 'Кроссовки Runner', 6990, 0, ['Белый', 'Чёрный', 'Синий']],
  [11, 's', 'Кроссовки Trail', 7890, 0, ['Зелёный', 'Серый', 'Красный']],
  [12, 's', 'Высокие кеды Street', 5490, 1, ['Чёрный', 'Белый', 'Красный']]
];

var cur = 'all';
var cart = [];

// ---------- НАСТОЯЩИЕ ФОТО ТОВАРОВ ----------
// Подставляем настоящее фото обуви в зависимости от названия
function photo(name) {
  var PH = {
    'Туфли Оксфорд':        'https://images.unsplash.com/photo-1614252369475-531eba835eb1?w=400',
    'Ботинки Челси':        'https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=400',
    'Лоферы классические':   'https://images.unsplash.com/photo-1533867617858-e7b97e060509?w=400',
    'Туфли-лодочки':        'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=400',
    'Ботильоны на каблуке': 'https://images.unsplash.com/photo-1603808033192-082d6919d3e1?w=400',
    'Балетки кожаные':      'https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=400',
    'Кеды детские':         'https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400',
    'Ботинки утеплённые':   'https://images.unsplash.com/photo-1542840410-3092f99611a3?w=400',
    'Сандалии летние':      'https://images.unsplash.com/photo-1603487742131-4160ec999306?w=400',
    'Кроссовки Runner':     'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400',
    'Кроссовки Trail':      'https://images.unsplash.com/photo-1551107696-a4b0c5a0d9a2?w=400',
    'Высокие кеды Street':  'https://images.unsplash.com/photo-1600269452121-4f2416e55c28?w=400'
  };
  return PH[name] || 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400';
}

// ---------- НАВИГАЦИЯ ----------
function nav() {
  var h = '';
  C.forEach(function(c) {
    h += '<a class="' + (c[0] == cur ? 'on' : '') + '" onclick="go(\'' + c[0] + '\')">' + c[1] + '</a>';
  });
  document.getElementById('nav').innerHTML = h;
}

function go(c) {
  cur = c;
  nav();
  show();
}

// ---------- ВЫВОД ТОВАРОВ ----------
function show() {
  var h = '';
  P.forEach(function(p) {
    if (cur != 'all' && p[1] != cur) return;

    var o = '', s = '', i;
    p[5].forEach(function(x) {
      o += '<option>' + x + '</option>';
    });
    for (i = Z[p[1]][0]; i <= Z[p[1]][1]; i++) {
      s += '<option>' + i + '</option>';
    }

    h += '<div class="c">' +
      '<img id="im' + p[0] + '" src="' + photo(p[2]) + '" onerror="fb(' + p[0] + ')" alt="' + p[2] + '">' +
      '<h3>' + p[2] + '</h3>' +
      '<div class="p">' + p[3] + ' ₽</div>' +
      '<p>Цвет: <select id="c' + p[0] + '" onchange="cc(' + p[0] + ')">' + o + '</select><br>' +
      'Размер: <select id="s' + p[0] + '">' + s + '</select></p>' +
      '<button class="b" onclick="add(' + p[0] + ')">В корзину</button>' +
      '</div>';
  });
  document.getElementById('list').innerHTML = h;
}

// ---------- ЦВЕТ / FALLBACK КАРТИНКИ ----------
function cc(id) {
  var p = P[id - 1];
  var e = document.getElementById('im' + id);
  // Всегда подставляем настоящее фото
  e.src = photo(p[2]);
}

function fb(id) {
  var e = document.getElementById('im' + id);
  e.onerror = null;
  // Если фото не загрузилось — ставим запасное
  e.src = 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400';
}

// ---------- КОРЗИНА ----------
function add(id) {
  var p = P[id - 1];
  cart.push({
    n: p[2],
    c: document.getElementById('c' + id).value,
    s: document.getElementById('s' + id).value,
    p: p[3]
  });
  cr();
}

function del(i) {
  cart.splice(i, 1);
  cr();
}

function cr() {
  var h = '', t = 0;
  cart.forEach(function(x, i) {
    t += x.p;
    h += '<div>' + (i + 1) + '. ' + x.n + ', ' + x.c + ', р. ' + x.s + ' — <b>' + x.p + ' ₽</b> <a href="#" onclick="del(' + i + ');return false">[удалить]</a></div>';
  });
  document.getElementById('cart').innerHTML = h || 'Пока пусто';
  document.getElementById('cn').innerHTML = cart.length;
  document.getElementById('tot').innerHTML = t + ' ₽';
}

function buy() {
  if (!cart.length) {
    alert('Корзина пуста');
    return;
  }
  alert('Спасибо за заказ! Мы свяжемся с вами для подтверждения.');
  cart = [];
  cr();
}

// ---------- ИНИЦИАЛИЗАЦИЯ ----------
nav();
show();
</script>
</body>
</html>
