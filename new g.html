<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обувной магазин «Шаг»</title>
<style>
  body {
    font-family: Verdana, Arial, sans-serif;
    background: #f7f3ec;          /* тёплый песочный фон */
    margin: 0;
    color: #2e2a26;               /* мягкий тёмно-коричневый текст */
  }
  a { color: #8a5a2b; }            /* тёплая коричневая ссылка */

  .h {
    background: linear-gradient(180deg, #6b4a2b 0%, #4e3520 100%);
    color: #fdf8f0;
    padding: 14px;
    text-align: center;
    border-bottom: 3px solid #3a2616;
  }
  .h h1 {
    margin: 0;
    font-family: Georgia, serif;
    letter-spacing: 1px;
    color: #fdf8f0;
  }
  .h marquee { color: #e8dcc8; }

  .n {
    background: #e9dcc5;           /* бежевая навигация */
    padding: 8px;
    text-align: center;
    border-bottom: 2px solid #b99a6b;
  }
  .n a {
    display: inline-block;
    margin: 3px;
    padding: 5px 12px;
    background: #fdf8f0;
    border: 1px solid #b99a6b;
    color: #5a3d22;
    text-decoration: none;
    cursor: pointer;
    border-radius: 4px;
    transition: all .2s ease;
  }
  .n a:hover { background: #f1e6d2; }
  .n a.on {
    background: #6b4a2b;
    color: #fdf8f0;
    border-color: #4e3520;
  }

  .w { max-width: 960px; margin: auto; padding: 10px; }

  .g { display: flex; flex-wrap: wrap; gap: 10px; }

  .c {
    width: calc(33% - 8px);
    min-width: 220px;
    flex-grow: 1;
    background: #fdfaf5;           /* почти белый тёплый */
    border: 1px solid #d8c7a8;
    padding: 8px;
    text-align: center;
    box-sizing: border-box;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(90, 61, 34, .08);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .c:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 14px rgba(90, 61, 34, .15);
  }
  .c img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border: 1px solid #e3d6bd;
    border-radius: 4px;
    background: #f1e6d2;
  }
  .c h3 {
    color: #4e3520;
    font-size: 15px;
    margin: 10px 0 6px;
  }

  .p {
    font-size: 18px;
    font-weight: bold;
    color: #8a5a2b;                /* тёплый акцент цены */
  }

  .b {
    background: #6b4a2b;
    color: #fdf8f0;
    border: 0;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 13px;
    transition: background .2s ease;
  }
  .b:hover { background: #4e3520; }

  select {
    padding: 3px 5px;
    border: 1px solid #cbb794;
    border-radius: 3px;
    background: #fdfaf5;
    color: #4e3520;
    font-size: 13px;
  }

  .k {
    background: #fdfaf5;
    border: 2px solid #b99a6b;
    padding: 12px;
    margin-top: 18px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(90, 61, 34, .08);
  }
  .k h2 {
    color: #4e3520;
    margin-top: 0;
    font-family: Georgia, serif;
  }

  .f {
    text-align: center;
    font-size: 12px;
    padding: 15px;
    color: #8a7a63;
    background: #efe6d4;
    border-top: 1px solid #d8c7a8;
  }
</style>
</head>
<body>

<!-- Шапка -->
<div class="h">
  <h1>👞 Обувной магазин «Шаг» 👟</h1>
  <marquee>Бесплатная доставка от 10000 ₽ &bull; Скидка 10% на второй товар &bull; Примерка при получении</marquee>
</div>

<!-- Навигация -->
<div class="n" id="nav"></div>

<!-- Контент -->
<div class="w">
  <div class="g" id="list"></div>
  <div class="k">
    <h2>Корзина (<span id="cn">0</span>)</h2>
    <div id="cart">Пока пусто</div>
    <p>Итого: <span class="p" id="tot">0 ₽</span>
      <button class="b" onclick="buy()">Оформить заказ</button>
    </p>
  </div>
</div>

<!-- Подвал -->
<div class="f">© 2026 Обувной магазин «Шаг». Учебный проект.</div>

<script>
// ---------- ДАННЫЕ ----------
var C = [
  ['all', 'Все'],
  ['m', 'Мужская'],
  ['w', 'Женская'],
  ['k', 'Детская'],
  ['s', 'Спортивная']
];

var K = {
  'Чёрный': '#222',
  'Коричневый': '#6b3e26',
  'Белый': '#f2f2f2',
  'Красный': '#c0392b',
  'Синий': '#2c5aa0',
  'Серый': '#888',
  'Бежевый': '#d8c3a5',
  'Зелёный': '#3c8d4f',
  'Розовый': '#e48aa8'
};

var Z = {
  m: [40, 46],
  w: [36, 41],
  k: [28, 35],
  s: [38, 46]
};

var P = [
  [1, 'm', 'Туфли Оксфорд', 5990, 0, ['Чёрный', 'Коричневый']],
  [2, 'm', 'Ботинки Челси', 7490, 1, ['Коричневый', 'Чёрный', 'Серый']],
  [3, 'm', 'Лоферы классические', 4990, 0, ['Бежевый', 'Коричневый']],
  [4, 'w', 'Туфли-лодочки', 6290, 2, ['Красный', 'Чёрный', 'Бежевый']],
  [5, 'w', 'Ботильоны на каблуке', 8190, 1, ['Чёрный', 'Серый', 'Розовый']],
  [6, 'w', 'Балетки кожаные', 3990, 0, ['Розовый', 'Белый', 'Чёрный']],
  [7, 'k', 'Кеды детские', 2490, 0, ['Синий', 'Красный', 'Белый']],
  [8, 'k', 'Ботинки утеплённые', 3790, 1, ['Зелёный', 'Синий']],
  [9, 'k', 'Сандалии летние', 1990, 3, ['Розовый', 'Синий', 'Белый']],
  [10, 's', 'Кроссовки Runner', 6990, 0, ['Белый', 'Чёрный', 'Синий']],
  [11, 's', 'Кроссовки Trail', 7890, 0, ['Зелёный', 'Серый', 'Красный']],
  [12, 's', 'Высокие кеды Street', 5490, 1, ['Чёрный', 'Белый', 'Красный']]
];

var cur = 'all';
var cart = [];

// ---------- НАСТОЯЩИЕ ФОТО ТОВАРОВ ----------
function photo(name) {
  var PH = {
    'Туфли Оксфорд':        'https://avatars.mds.yandex.net/i?id=d970b2150f56191829bf2890d149cb94_l-16291675-images-thumbs&n=13',
    'Ботинки Челси':        'https://n.cdn.cdek.shopping/images/shopping/BoF8rZisEexyEn0X.jpg?v=1',
    'Лоферы классические':   'https://tse2.mm.bing.net/th/id/OIP.6LEO2GqlRcYNCJ1fcJWtcQHaI_?r=0&rs=1&pid=ImgDetMain&o=7&rm=3',
    'Туфли-лодочки':        'https://basket-15.wbbasket.ru/vol2207/part220734/220734652/images/big/1.webp',
    'Ботильоны на каблуке': 'https://n.cdn.cdek.shopping/images/shopping/WPZ05hOssNDpoWOP.webp?v=1',
    'Балетки кожаные':      'https://n.cdn.cdek.shopping/images/shopping/48b60ee2-8b7b-4121-9c65-f5fc523b4ae2.webp?v=1',
    'Кеды детские':         'https://avatars.mds.yandex.net/i?id=dae2ae33bcd6da8a60018448580c5dbac58bfb25-5194768-images-thumbs&n=13',
    'Ботинки утеплённые':   'https://avatars.mds.yandex.net/i?id=44ee965f1f131d29f4b9a0fe67017be050e8d30b-5333638-images-thumbs&n=13',
    'Сандалии летние':      'https://basket-02.wbbasket.ru/vol184/part18480/18480994/images/big/1.webp',
    'Кроссовки Runner':     'https://n.cdn.cdek.shopping/images/shopping/F0sNT7SlccaXNjkR.jpg?v=1',
    'Кроссовки Trail':      'https://avatars.mds.yandex.net/i?id=d611f9d7e2653fb8d1de4522e2e7ac46_l-5876515-images-thumbs&n=13',
    'Высокие кеды Street':  'https://avatars.mds.yandex.net/i?id=46fe118ad098949456a727610acf8f89_l-9181231-images-thumbs&n=13'
  };
  return PH[name] || 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400';
}

// ---------- НАВИГАЦИЯ ----------
function nav() {
  var h = '';
  C.forEach(function(c) {
    h += '<a class="' + (c[0] == cur ? 'on' : '') + '" onclick="go(\'' + c[0] + '\')">' + c[1] + '</a>';
  });
  document.getElementById('nav').innerHTML = h;
}

function go(c) {
  cur = c;
  nav();
  show();
}

// ---------- ВЫВОД ТОВАРОВ ----------
function show() {
  var h = '';
  P.forEach(function(p) {
    if (cur != 'all' && p[1] != cur) return;

    var o = '', s = '', i;
    p[5].forEach(function(x) {
      o += '<option>' + x + '</option>';
    });
    for (i = Z[p[1]][0]; i <= Z[p[1]][1]; i++) {
      s += '<option>' + i + '</option>';
    }

    h += '<div class="c">' +
      '<img id="im' + p[0] + '" src="' + photo(p[2]) + '" onerror="fb(' + p[0] + ')" alt="' + p[2] + '">' +
      '<h3>' + p[2] + '</h3>' +
      '<div class="p">' + p[3] + ' ₽</div>' +
      '<p>Цвет: <select id="c' + p[0] + '" onchange="cc(' + p[0] + ')">' + o + '</select><br>' +
      'Размер: <select id="s' + p[0] + '">' + s + '</select></p>' +
      '<button class="b" onclick="add(' + p[0] + ')">В корзину</button>' +
      '</div>';
  });
  document.getElementById('list').innerHTML = h;
}

// ---------- ЦВЕТ / FALLBACK КАРТИНКИ ----------
function cc(id) {
  var p = P[id - 1];
  var e = document.getElementById('im' + id);
  e.src = photo(p[2]);
}

function fb(id) {
  var e = document.getElementById('im' + id);
  e.onerror = null;
  e.src = 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400';
}

// ---------- КОРЗИНА ----------
function add(id) {
  var p = P[id - 1];
  cart.push({
    n: p[2],
    c: document.getElementById('c' + id).value,
    s: document.getElementById('s' + id).value,
    p: p[3]
  });
  cr();
}

function del(i) {
  cart.splice(i, 1);
  cr();
}

function cr() {
  var h = '', t = 0;
  cart.forEach(function(x, i) {
    t += x.p;
    h += '<div>' + (i + 1) + '. ' + x.n + ', ' + x.c + ', р. ' + x.s + ' — <b>' + x.p + ' ₽</b> <a href="#" onclick="del(' + i + ');return false">[удалить]</a></div>';
  });
  document.getElementById('cart').innerHTML = h || 'Пока пусто';
  document.getElementById('cn').innerHTML = cart.length;
  document.getElementById('tot').innerHTML = t + ' ₽';
}

function buy() {
  if (!cart.length) {
    alert('Корзина пуста');
    return;
  }
  alert('Спасибо за заказ! Мы свяжемся с вами для подтверждения.');
  cart = [];
  cr();
}

// ---------- ИНИЦИАЛИЗАЦИЯ ----------
nav();
show();
</script>
</body>
</html>
