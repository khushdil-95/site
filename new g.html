<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обувной магазин «Шаг»</title>
<style>

<!-- Контент -->
<div class="w">
  <div class="g" id="list"></div>
  <div class="k">
    <h2>Корзина (<span id="cn">0</span>)</h2>
    <div id="cart">Пока пусто</div>
    <p>Итого: <span class="p" id="tot">0 ₽</span>
      <button class="b" onclick="buy()">Оформить заказ</button>
    </p>
  </div>
</div>

<!-- Подвал -->
<div class="f">© 2026 Обувной магазин «Шаг». Учебный проект.</div>

<script>
// ---------- ДАННЫЕ ----------
var C = [
  ['all', 'Все'],
  ['m', 'Мужская'],
  ['w', 'Женская'],
  ['k', 'Детская'],
  ['s', 'Спортивная']
];

var K = {
  'Чёрный': '#222',
  'Коричневый': '#6b3e26',
  'Белый': '#f2f2f2',
  'Красный': '#c0392b',
  'Синий': '#2c5aa0',
  'Серый': '#888',
  'Бежевый': '#d8c3a5',
  'Зелёный': '#3c8d4f',
  'Розовый': '#e48aa8'
};

var Z = {
  m: [40, 46],
  w: [36, 41],
  k: [28, 35],
  s: [38, 46]
};

var P = [
  [1, 'm', 'Туфли Оксфорд', 5990, 0, ['Чёрный', 'Коричневый']],
  [2, 'm', 'Ботинки Челси', 7490, 1, ['Коричневый', 'Чёрный', 'Серый']],
  [3, 'm', 'Лоферы классические', 4990, 0, ['Бежевый', 'Коричневый']],
  [4, 'w', 'Туфли-лодочки', 6290, 2, ['Красный', 'Чёрный', 'Бежевый']],
  [5, 'w', 'Ботильоны на каблуке', 8190, 1, ['Чёрный', 'Серый', 'Розовый']],
  [6, 'w', 'Балетки кожаные', 3990, 0, ['Розовый', 'Белый', 'Чёрный']],
  [7, 'k', 'Кеды детские', 2490, 0, ['Синий', 'Красный', 'Белый']],
  [8, 'k', 'Ботинки утеплённые', 3790, 1, ['Зелёный', 'Синий']],
  [9, 'k', 'Сандалии летние', 1990, 3, ['Розовый', 'Синий', 'Белый']],
  [10, 's', 'Кроссовки Runner', 6990, 0, ['Белый', 'Чёрный', 'Синий']],
  [11, 's', 'Кроссовки Trail', 7890, 0, ['Зелёный', 'Серый', 'Красный']],
  [12, 's', 'Высокие кеды Street', 5490, 1, ['Чёрный', 'Белый', 'Красный']]
];

var cur = 'all';
var cart = [];

// ---------- НАСТОЯЩИЕ ФОТО ТОВАРОВ ----------
// Подставляем настоящее фото обуви в зависимости от названия
function photo(name) {
  var PH = {
    'Туфли Оксфорд':        'https://avatars.mds.yandex.net/i?id=d970b2150f56191829bf2890d149cb94_l-16291675-images-thumbs&n=13',
    'Ботинки Челси':        'https://n.cdn.cdek.shopping/images/shopping/BoF8rZisEexyEn0X.jpg?v=1',
    'Лоферы классические':   'https://tse2.mm.bing.net/th/id/OIP.6LEO2GqlRcYNCJ1fcJWtcQHaI_?r=0&rs=1&pid=ImgDetMain&o=7&rm=3',
    'Туфли-лодочки':        'https://basket-15.wbbasket.ru/vol2207/part220734/220734652/images/big/1.webp',
    'Ботильоны на каблуке': 'https://n.cdn.cdek.shopping/images/shopping/WPZ05hOssNDpoWOP.webp?v=1',
    'Балетки кожаные':      'https://n.cdn.cdek.shopping/images/shopping/48b60ee2-8b7b-4121-9c65-f5fc523b4ae2.webp?v=1',
    'Кеды детские':         'https://avatars.mds.yandex.net/i?id=dae2ae33bcd6da8a60018448580c5dbac58bfb25-5194768-images-thumbs&n=13',
    'Ботинки утеплённые':   'https://avatars.mds.yandex.net/i?id=44ee965f1f131d29f4b9a0fe67017be050e8d30b-5333638-images-thumbs&n=13',
    'Сандалии летние':      'https://basket-02.wbbasket.ru/vol184/part18480/18480994/images/big/1.webp',
    'Кроссовки Runner':     'https://n.cdn.cdek.shopping/images/shopping/F0sNT7SlccaXNjkR.jpg?v=1',
    'Кроссовки Trail':      'https://avatars.mds.yandex.net/i?id=d611f9d7e2653fb8d1de4522e2e7ac46_l-5876515-images-thumbs&n=13',
    'Высокие кеды Street':  'https://avatars.mds.yandex.net/i?id=46fe118ad098949456a727610acf8f89_l-9181231-images-thumbs&n=13'
  };
  return PH[name] || 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400';
}

// ---------- НАВИГАЦИЯ ----------
function nav() {
  var h = '';
  C.forEach(function(c) {
    h += '<a class="' + (c[0] == cur ? 'on' : '') + '" onclick="go(\'' + c[0] + '\')">' + c[1] + '</a>';
  });
  document.getElementById('nav').innerHTML = h;
}

function go(c) {
  cur = c;
  nav();
  show();
}

// ---------- ВЫВОД ТОВАРОВ ----------
function show() {
  var h = '';
  P.forEach(function(p) {
    if (cur != 'all' && p[1] != cur) return;

    var o = '', s = '', i;
    p[5].forEach(function(x) {
      o += '<option>' + x + '</option>';
    });
    for (i = Z[p[1]][0]; i <= Z[p[1]][1]; i++) {
      s += '<option>' + i + '</option>';
    }

    h += '<div class="c">' +
      '<img id="im' + p[0] + '" src="' + photo(p[2]) + '" onerror="fb(' + p[0] + ')" alt="' + p[2] + '">' +
      '<h3>' + p[2] + '</h3>' +
      '<div class="p">' + p[3] + ' ₽</div>' +
      '<p>Цвет: <select id="c' + p[0] + '" onchange="cc(' + p[0] + ')">' + o + '</select><br>' +
      'Размер: <select id="s' + p[0] + '">' + s + '</select></p>' +
      '<button class="b" onclick="add(' + p[0] + ')">В корзину</button>' +
      '</div>';
  });
  document.getElementById('list').innerHTML = h;
}

// ---------- ЦВЕТ / FALLBACK КАРТИНКИ ----------
function cc(id) {
  var p = P[id - 1];
  var e = document.getElementById('im' + id);
  // Всегда подставляем настоящее фото
  e.src = photo(p[2]);
}

function fb(id) {
  var e = document.getElementById('im' + id);
  e.onerror = null;
  // Если фото не загрузилось — ставим запасное
  e.src = 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400';
}

// ---------- КОРЗИНА ----------
function add(id) {
  var p = P[id - 1];
  cart.push({
    n: p[2],
    c: document.getElementById('c' + id).value,
    s: document.getElementById('s' + id).value,
    p: p[3]
  });
  cr();
}

function del(i) {
  cart.splice(i, 1);
  cr();
}

function cr() {
  var h = '', t = 0;
  cart.forEach(function(x, i) {
    t += x.p;
    h += '<div>' + (i + 1) + '. ' + x.n + ', ' + x.c + ', р. ' + x.s + ' — <b>' + x.p + ' ₽</b> <a href="#" onclick="del(' + i + ');return false">[удалить]</a></div>';
  });
  document.getElementById('cart').innerHTML = h || 'Пока пусто';
  document.getElementById('cn').innerHTML = cart.length;
  document.getElementById('tot').innerHTML = t + ' ₽';
}

function buy() {
  if (!cart.length) {
    alert('Корзина пуста');
    return;
  }
  alert('Спасибо за заказ! Мы свяжемся с вами для подтверждения.');
  cart = [];
  cr();
}

// ---------- ИНИЦИАЛИЗАЦИЯ ----------
nav();
show();
</script>
</body>
</html>
